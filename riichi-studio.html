:root {
  --ui-scale: 1.5;
  --paper: #f2efe5;
  --panel: #fcfaf2;
  --ink: #20382f;
  --green: #245a48;
  --dark: #173d32;
  --muted: #65736a;
  --rule: #d5dacb;
  --gold: #b78e4d;
  --rust: #983e34;
  --serif: TileSerif, "Noto Serif CJK HK", "Songti TC", "PMingLiU", serif;
  --sans: "Inter", "Segoe UI", DojoSans, "PingFang HK", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", Consolas, "Liberation Mono", monospace;
  color: var(--ink);
  background: var(--paper);
  font-family: var(--sans);
  font-size: calc(12px * var(--ui-scale));
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at 65% 2%, #fdfbf2, transparent 68%), var(--paper);
}
[hidden] { display: none !important; }
button, input, select { font: inherit; }
button, select { color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
  outline: 3px solid #bd8f47;
  outline-offset: 3px;
}
.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  clip: rect(0,0,0,0); overflow: hidden; white-space: nowrap;
}
.icon { display: inline-block; vertical-align: middle; flex: none; }
.mast { background: #fbf9f1; border-bottom: 1px solid #d6d9cd; }
.mast-in, .layout { max-width: 2450px; margin-inline: auto; }
.mast-in {
  min-height: clamp(55px, 3.7rem, 77px);
  padding: 0 clamp(12px, 1.5vw, 29px);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.brand, .head-actions, .btn { display: flex; align-items: center; }
.brand { gap: 12px; white-space: nowrap; }
.brand-word {
  font: 700 clamp(24px, 1.78rem, 38px)/1.18 var(--serif); letter-spacing: .095em; color: #193f32;
}
.brand-sub {
  padding-left: 13px; border-left: 1px solid #cbd0c3;
  color: #596b5e; font-size: .69rem; letter-spacing: .075em;
}
.brandmark {
  width: clamp(29px, 2.35rem, 48px); height: clamp(33px, 2.52rem, 53px);
  background: #245641; border: 1.5px solid #194737; border-radius: 9px; transform: rotate(-4deg);
  box-shadow: inset 0 0 0 3px #3a6951, 0 2px #b7b29e; display: grid; place-content: center; grid-auto-flow: column; gap: 4px;
}
.brandmark i { display: block; position: relative; width: 3px; height: 1.14rem; border-radius: 2px; background: #f0dba5; align-self: center; }
.brandmark i:nth-child(2) { height: 1.51rem; }
.brandmark i::before, .brandmark i::after {
  content: ""; position: absolute; left: -1px; top: 23%; width: 5px; height: 2px; border-radius: 1px; background: #f0dba5;
}
.brandmark i::after { top: 67%; }
.head-actions { gap: clamp(4px, .7vw, 12px); }

.call-effect {

}
.call-plaque {
  isolation: isolate; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
  gap: .61rem; width: max-content; min-width: 77%; padding: .39rem .86rem .54rem;

  box-shadow: 0 0 0 3px #6e352c88, 0 0 26px #ffae7d65;

.call-ring {
  position: absolute; width: 100%; aspect-ratio: 3.5; border: 1px solid var(--call-accent); border-radius: 16px;
  box-shadow: 0 0 17px var(--call-accent);

@keyframes call-in {

        const p=result.ps[i];
        if(drop)p.river.push(...drop);
        if(last)p.river[p.river.length-1]=last;
        Object.assign(p,fields);
      }
    }
    const {wallSize,...r}=result;
    // A review needs tile count and the visible indicators. The shuffled live wall is kept only for the active hand.
    return {...r,live:Array(wallSize)};
  }

  function differences(records){
    const positions=[];
    for(const record of records){
      const legacy=record.legacy||[];
      legacy.forEach((item,index)=>positions.push({id:record.id,index,gap:item.gap}));
      record.steps?.forEach(({event},index)=>{
        if(event.grade?.difference)positions.push({id:record.id,index:index+legacy.length,gap:event.grade.gap});
      });
    }
    return positions;
  }

  function decisions(record){
    const legacy=record.legacy||[];
    const own=record.steps?.flatMap(({event},index)=>event.kind==="discard" && event.i===0?[legacy.length+index]:[])||[];
    return legacy.map((_,index)=>index).concat(own);
  }
  function length(record){return (record.legacy?.length||0)+(record.initial?record.steps.length:-1);}
  function lookup(record,index){
    const legacy=record.legacy?.[index];
    if(legacy)return {legacy,state:null};
    const at=index-(record.legacy?.length||0);
    return {state:frame(record,at),upcoming:record.steps[at]?.event,last:record.steps[at-1]?.event};
  }

  return {limit,defaults,restore,begin,pack,append,frame,differences,decisions,length,lookup};
})();

  function compareDisc(best,other){

    else if(best.s===other.s && best.uke>other.uke)bits.push("同為"+Coach.shText(best.s)+"，打"+name(best.k)+"多保留 "+(best.uke-other.uke)+" 枚有效牌");
    if(other.risk-best.risk>.13)bits.push("打"+name(best.k)+"嘅估算放銃風險較低");
    if(best.s===0 && other.furiten && !best.furiten)bits.push("打"+name(other.k)+"會造成振聽");
    if(best.future!=null && other.future!=null && best.future-other.future>=1)bits.push("進張後平均多約 "+(best.future-other.future).toFixed(1)+" 枚和牌張");
    if(other.bonusLost>best.bonusLost)bits.push("打"+name(best.k)+"保留更多寶牌");
    if(best.s===0 && other.s===0 && best.waitValue>other.waitValue*1.25 && best.waitValue-other.waitValue>250)bits.push("推薦嘅聽牌有較高嘅估算打點");
    if(!bits.length)bits.push(best.score===other.score?"兩個選擇嘅評分相同":"兩者嘅牌形、打點及守備評分有差別");

    return rule("打牌與回顧","撳手牌揀牌，再撳同一隻或「打出」確認。亦可以用方向鍵揀牌，撳 Enter 打出。有鳴牌或和牌選擇時，手牌前方會顯示動作。逐巡回顧會暫停實戰，並可用「上一步／下一步」查看四家嘅行動。",true)+
      rule("四人東、四人南同終局","每局重新隨機洗牌，四家各從 25,000 點開始全場。東風戰打東一至東四。半莊戰打東一至南四。莊家和牌或荒牌聽牌連莊。負分即完場。最後一局莊家和牌或流局聽牌兼首位會收莊。採用固定場數，同分按開局座次排。完場供託歸首位。")+
      rule("立直、振聽與和牌","支援吃、碰、三種槓、榮和、自摸、搶加槓同國士搶暗槓。和牌至少要有一役。門前聽牌、持有 1,000 點同牌山尚餘至少 4 枚可立直。立直後可摸切，或在牌形與聽張不變時暗槓。振聽仍可自摸。放過可完成手牌嘅牌之後，同巡振聽會持續到下次摸牌或鳴牌。立直後見逃會振聽到局尾。")+
      rule("寶牌、計分與本場","有食斷同後付，每門各一隻赤五。支援寶牌、裏寶、槓寶、槓裏寶，同一手取最高合法點數。採用原符滿貫門檻，13 番或以上累計役滿。純正九蓮、國士十三面、四暗刻單騎同大四喜為雙倍役滿。大三元、大四喜有包牌。本場每次 300 點。兩家榮和均收本場，供託歸放銃者下家方向最近嘅和家。")+
      rule("流局同副露","荒牌時，未聽牌嘅玩家合共支付 3,000 點，聽牌嘅玩家平分。四人齊聽或齊未聽都保留原有點數。流局滿貫要求自己門前，牌河全為么九牌兼全未被鳴。九種九牌可主動選擇流局。四風連打、四家立直、三家和牌及多人合共四槓後無人榮和會途中流局。禁止食替，槓寶即開。")+
      rule("點樣睇副露橫牌","以鳴牌者視角睇，取自上家嘅牌橫放左邊，對家放中間，下家放右邊。加槓嘅第四張橫疊喺原本嗰張橫牌上。暗槓會蓋住兩端。")+
      rule("點樣睇評分",scoreScale+scoreFactors)+
      rule("輔助與本機紀錄","出牌同動作評分只參考自家手牌同公開資訊。紅色「銃」會另外核對三家實際手牌、役、同埋振聽。揀中手牌後，四家牌河嘅同款牌會變藍，紅五同普通五都會一齊標示。寶牌同紅五會有金光。淡色箭嘴表示已被鳴走嘅牌。本機保留最近 20 局，每局完整記錄。同一瀏覽器、同一檔案位置可以續局。")+
      '<details class="rule-item"><summary>字體授權</summary><pre class="licence" id="license-text"></pre></details>';
  }
  function detail(v,d){
    const best=d.rank[0];if(!best)return "<p>等候下一個出牌決定。</p>";
    const row=d.rank.find(x=>x.k===rankFocus)||best,actual=pickedTile(v);
    const eff=row.eff.map(([t,n])=>'<span class="eff-item" title="'+name(t)+'，餘 '+n+' 枚">'+tile(t)+"×"+n+'</span>').join('');
    const livePick=actual===null?null:d.rank.find(x=>x.k===key(actual));
    const score=actionScore(d,row),val=row.s===0?(row.furiten?"振聽，只能自摸。":"按可立直則立直計，"+row.ronUke+" 枚有榮和役。"):"";
    const situ=livePick?'<div class="review-reason"><b>你打 '+name(key(actual))+' · '+(v.upcoming.grade?.score??actionScore(d,livePick))+' 分</b>'+
      (v.upcoming.grade?.gap?'　同最高選擇相差 '+v.upcoming.grade.gap+' 分。':"")+'</div>':'';
    return situ+'<div class="detail-box"><b>打 '+name(row.k)+' · '+score+' 分</b><p>'+summary(row)+'</p>'+
      (row.future!=null?'<p>有效進張後，最佳聽牌平均有 '+row.future.toFixed(1)+' 枚未見和牌張。</p>':'')+(val?'<p>'+val+'</p>':'')+
      (row.k!==best.k?'<p>'+compareDisc(best,row)+'</p>':'')+
      '<div class="detail-tiles">'+(eff||'<small>未見牌當中冇有效進張。</small>')+'</div></div>'+
      '<table class="ranklist"><thead><tr><th>打出</th><th>評分</th><th>牌形</th><th>有效枚數</th><th>放銃風險</th></tr></thead><tbody>'+
      d.rank.map(x=>{
        const n=actionScore(d,x);
        return '<tr class="'+(x.k===row.k?'chosen':'')+'"><td>'+button("rank",tile(x.k)+name(x.k)+
          (n===100?'<small class="tiny-label">推薦</small>':'')+
          (actual!==null && key(actual)===x.k?'<small class="tiny-label played">我打</small>':''),"rank-item",' data-k="'+x.k+'"')+
          '</td><td class="rate">'+n+'</td><td>'+Coach.shText(x.s)+'</td><td>'+x.uke+'</td><td>'+Coach.riskText(x)+'</td></tr>';
      }).join('')+'</tbody></table><details class="rule-item score-guide"><summary>點樣計分</summary><p>'+scoreScale+scoreFactors+'</p></details>';
  }
  function callDetail(v,d){
    const best=d.actions[0];if(!best)return '<p>當刻可以直接出牌。</p>';
    const row=d.actions.find(x=>x.choice===callFocus)||best;
    const attempt=chosenAction(v)||(pickedTile(v)!==null?"pass-turn":null);
    const gap=v.upcoming?.grade?.gap;
    return '<div class="detail-box"><b>'+actionLabel(row.kind)+' · '+row.score+' 分</b><p>'+actionReason(row)+'</p>'+
      (best.score>row.score?'<p>同'+actionLabel(best.kind)+'相差 '+(best.score-row.score)+' 分。</p>':'')+
      (row.tiles?'<div class="modal-tiles">'+row.tiles.map(id=>faceTile(id,v.snap.dora)).join('')+'</div>':'')+'</div>'+
      (gap?'<div class="review-reason">你當時嘅選擇同最高分相差 '+gap+' 分。</div>':'')+
      '<table class="ranklist"><thead><tr><th>動作</th><th>評分</th><th>牌形</th><th>有效枚數</th></tr></thead><tbody>'+
      d.actions.map(x=>'<tr class="'+(x.choice===row.choice?'chosen':'')+'"><td>'+button("rank-call",actionLabel(x.kind)+
        (x.tiles?'<span class="comparison-tiles">'+x.tiles.map(id=>faceTile(id,v.snap.dora)).join('')+'</span>':'')+
        (x.score===100?'<small class="tiny-label">推薦</small>':'')+(x.choice===attempt?'<small class="tiny-label played">我揀</small>':''),
        "rank-item",' data-choice="'+x.choice+'"')+'</td><td class="rate">'+x.score+'</td><td>'+(x.win?"和牌":Coach.shText(x.s))+
        '</td><td>'+(x.uke??"—")+'</td></tr>').join('')+'</tbody></table>'+
      '<details class="rule-item score-guide"><summary>點樣計分</summary><p>'+scoreScale+scoreFactors+'</p></details>';
  }
  function resultView(v){
    const state=v.state,end=state?.result;if(!end)return "";
    let out='<p>'+modeName(state.mode)+'　'+fmtRound(state)+(end.end?' · 全場完結':'')+'</p>';
    if(end.reason)out+='<div class="detail-box">'+end.reason+(end.ten?' · '+(end.ten.length?end.ten.map(i=>pos[i]).join('、')+'聽牌':'四家未聽'):'')+'</div>';
    for(const w of end.wins){
      const p=state.ps[w.i],score=w.val,tsumo=end.from===null,ids=p.hand.filter(id=>!tsumo || id!==w.id).sort((a,b)=>a-b);
      const bonus=v.snap.dora.concat(p.riichi?MJ.indicators(state,true):[]);
      const label=score.limit?(score.limit===1?'役滿':score.limit+' 倍役滿'):score.han+' 番'+(score.fu?' '+score.fu+' 符':'');
      out+='<div class="result-win"><h3>'+pos[w.i]+'（'+WINDS[seat(state,w.i)]+'） · '+
        (w.id===null?'流局滿貫':tsumo?'自摸':pos[end.from]+'放銃')+' · '+label+'</h3>'+
        '<div class="modal-tiles">'+ids.map(id=>faceTile(id,bonus)).join('')+(w.id!==null?faceTile(w.id,bonus,"winning-tile"):'')+p.melds.slice().reverse().map(m=>meld(m,w.i,bonus)).join('')+
        '</div><div class="tags">'+score.yaku.map(y=>'<span>'+y.name+' '+y.n+(score.limit?' 倍':' 番')+'</span>').join('')+'</div>'+
        (p.riichi?'<p>裏寶指示牌　'+MJ.indicators(state,true).map(id=>tile(key(id),"tiny-dora")).join('')+'</p>':'')+
        (w.pao?.length?'<p>包牌 · '+w.pao.map(i=>pos[i]).join('、')+'</p>':'')+'</div>';
    }
    if(end.pot)out+='<p>供託 '+num(end.pot)+' 點由'+pos[end.wins[0].i]+'收取。</p>';
    if(end.lastPot)out+='<p>完場供託 '+num(end.lastPot.n)+' 點歸'+pos[end.lastPot.i]+'。</p>';
    const scores=Game.ranking(state).map((i,j)=>{
      const change=end.delta[i];
      return '<tr><td>'+(end.end?(j+1)+'　':'')+WINDS[seat(state,i)]+' · '+pos[i]+'</td><td class="'+(change>=0?'pos':'neg')+'">'+
        (change>0?"+":"")+num(change)+'</td><td>'+num(state.ps[i].points)+'</td></tr>';
    }).join('');
    const next=live()?(end.end?button("settings","另開新場","btn"):button("advance",end.repeat?"繼續連莊":"下一局","btn")):"";
    return out+'<table class="ranklist"><thead><tr><th>'+(end.end?'最終排名':'席次')+'</th><th>本局變動</th><th>持點</th></tr></thead><tbody>'+scores+
      '</tbody></table><div class="dialog-actions">'+button("close","返回牌枱","btn")+next+
      button(live()?"review-current":"replay-first",icon("history",16)+"逐巡回顧","btn primary")+'</div>';
  }
  function modalRender(){
    const v=view(),resultTitle=v.state?.result?.title||"本局結算";
    const titles={settings:"對局設定",rules:"玩法與局例",compare:"比較出牌","call-detail":"比較動作",result:resultTitle};
    const wide=["compare","call-detail","result"].includes(modal);
    let body="";
    if(modal==="settings")body=settings();
    if(modal==="rules")body=rules();
    if(modal==="compare")body=detail(v,decision(v));
    if(modal==="call-detail")body=callDetail(v,decision(v));
    if(modal==="result")body=resultView(v);
    document.body.style.overflow="hidden";
    $("#modal-host").innerHTML='<div class="shade"><section class="dialog '+(wide?"wide":"")+'" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1">'+
      '<div class="dialog-head"><h2 id="dialog-title">'+titles[modal]+'</h2>'+button("close",icon("close",17),"xbtn",' aria-label="關閉"')+'</div>'+body+'</section></div>';
    if(modal==="rules")$("#license-text").textContent=FONT_NOTICE;
  }
  function csv(){
    const quote=xs=>xs.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',');
    const lines=[["場次","局","本場","步","實際選擇","評分","建議","分差"]];
    for(const p of diffs){
      const rec=findRecord(p.id),value=Replay.lookup(rec,p.index),old=value.legacy,state=old?.snap||rec.initial,e=value.upcoming;
      if(old){
        const row=old.rank.find(x=>x.k===key(old.picked));
        lines.push([state.serial,roundText(state),state.honba,old.turn,"打 "+name(key(old.picked)),row?.score??"", "打 "+name(old.rank[0].k),p.gap]);
        continue;
      }
      const d=decision({state:value.state});
      const best=d.actions[0],recommend=best && best.kind!=="pass-turn"?actionLabel(best.kind):"打 "+name(d.rank[0].k);
      const played=e.kind==="discard"?"打 "+name(key(e.id)):actionLabel(e.attempt.split("/")[0]);
      lines.push([state.serial,roundText(state),state.honba,p.index+1,played,e.grade.score,recommend,p.gap]);
    }
    const url=URL.createObjectURL(new Blob(["\uFEFF"+lines.map(quote).join("\r\n")],{type:"text/csv;charset=utf-8"}));
    const a=document.createElement("a");a.href=url;a.download="雀研室-差異回顧.csv";a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  function begin(next,newMatch=false){
    r=next;record=Replay.begin(data,r);lastState=Replay.pack(r);cursor=null;
    botWait=null;queuedReply=null;reachFlash=null;
    diffs=Replay.differences(data.records);
    if(newMatch)data.stats={moves:0,sum:0,diffs:0};
    invalidate();save();
    if(modal)closeModal();else refresh();
  }
  function applySettings(makeNew){
    for(const k of ["threshold","speed","zoom"])data.prefs[k]=draft[k];
    if(makeNew){begin(Game.start(draft.mode,draft.styles,r.serial+1),true);return;}
    const changedStyles=r.styles.some((style,i)=>style!==draft.styles[i]);
    if(changedStyles && r.phase!=="result"){
      r.styles=draft.styles.slice();r.styles.forEach((s,i)=>r.ps[i+1].style=s);
      lastState=Replay.append(record,lastState,r,{kind:"styles"});
      if(botWait)botWait.next=null;
    }else if(changedStyles)r.styles=draft.styles.slice();
    invalidate();save();closeModal();
  }
  function selectTile(id){
    selected=id;refresh();
    document.querySelector('[data-act="tile"][data-id="'+id+'"]:not(:disabled)')?.focus({preventScroll:true});
  }
  function refreshModal(selector){
    const top=$("#dialog").scrollTop;modalRender();$("#dialog").scrollTop=top;
    document.querySelector(selector)?.focus({preventScroll:true});
  }
  document.addEventListener("input",ev=>{
    const e=ev.target;
    if(e.dataset.field==="speed" && draft){draft.speed=+e.value;$("#speed-value").textContent=formatSpeed(draft.speed);}
    if(e.dataset.field==="replay-index"){
      e.closest(".replay-range").querySelector("span").textContent="第 "+e.value+" / "+e.max+" 步";
    }
  });
  document.addEventListener("change",ev=>{
    const e=ev.target,k=e.dataset.field;
    if(k==="style")draft.styles[+e.dataset.idx]=e.value;
    if(k==="threshold" || k==="speed" || k==="zoom")draft[k]=+e.value;
    if(k==="replay-round"){goReplay(+e.value);$("#replay-round")?.focus({preventScroll:true});}
    if(k==="replay-index" && !live()){
      goReplay(cursor.id,+e.value);document.querySelector('[data-field="replay-index"]')?.focus({preventScroll:true});
    }
  });
  document.addEventListener("click",ev=>{
    if(ev.target.classList.contains("shade")){closeModal();return;}
    const el=ev.target.closest("button[data-act]");if(!el || el.disabled)return;
    const a=el.dataset.act,idx=+el.dataset.idx;
    if(["settings","rules","result","compare","call-detail"].includes(a)){showModal(a);return;}
    switch(a){
      case "close":closeModal();break;
      case "panel":mobileOpen=!mobileOpen;side();document.querySelector(".mobile-panel")?.focus({preventScroll:true});break;
      case "toggle":{
        const k=el.dataset.k;if(!["analysis","show","gun"].includes(k))return;
        data.prefs[k]=!data.prefs[k];save();refresh();
        document.querySelector('[data-act="toggle"][data-k="'+k+'"]')?.focus({preventScroll:true});break;
      }
      case "prev":case "next-review":{
        const dest=adjacentDiff(a==="prev"?-1:1);if(dest)goReplay(dest.id,dest.index,{act:a});break;
      }
      case "review-current":goReplay(record.id);break;
      case "return":exitReplay();break;
      case "replay-first":if(!live())goReplay(cursor.id);break;
      case "replay-end":if(!live())goReplay(cursor.id,Replay.length(findRecord(cursor.id)));break;
      case "replay-step":case "replay-self":{
        const dir=+el.dataset.dir;navigateReplay(dir,a==="replay-self",{act:a,dir});break;
      }
      case "advance":{
        const next=live()?Game.next(r):null;if(next)begin(next);break;
      }
      case "rank":rankFocus=+el.dataset.k;refreshModal('[data-act="rank"][data-k="'+rankFocus+'"]');break;
      case "rank-call":callFocus=el.dataset.choice;refreshModal('[data-act="rank-call"][data-choice="'+callFocus+'"]');break;
      case "tile":{
        const id=+el.dataset.id;if(live() && selected===id)play();else selectTile(id);break;
      }
      case "commit":play();break;
      case "reach":reachPick=!reachPick;selected=null;refresh();break;
      case "own":ownAct(idx);break;
      case "pass":takeClaim(null);break;
      case "claim":takeClaim(idx);break;
      case "pass-turn":document.querySelector('.hand-tile:not(:disabled)')?.focus({preventScroll:true});break;
      case "mode":draft.mode=el.dataset.mode;confirmReset=false;refreshModal('[data-act="mode"][data-mode="'+draft.mode+'"]');break;
      case "new":applySettings(true);break;
      case "cancel-new":confirmReset=false;refreshModal('[data-act="ask-new"]');break;
      case "apply":if(draft.mode===r.mode){applySettings(false);break;}
        // Selecting a new mode requires the same restart confirmation as the New Match button.
      case "ask-new":
        if(r.phase==="result" && r.result.end){applySettings(true);break;}
        confirmReset=true;refreshModal('[data-act="new"]');break;
      case "export":csv();break;
    }
  });
  document.addEventListener("keydown",ev=>{
    if(modal){
      if(ev.key==="Escape"){ev.preventDefault();closeModal();return;}
      if(ev.key==="Tab"){
        const els=[...$("#dialog").querySelectorAll('button:not(:disabled),select,input,summary')];
        if(!els.length)return;
        if(ev.shiftKey && (document.activeElement===els[0] || document.activeElement===$("#dialog"))){ev.preventDefault();els.at(-1).focus();}
        else if(!ev.shiftKey && document.activeElement===els.at(-1)){ev.preventDefault();els[0].focus();}
      }
      return;
    }
    if(ev.altKey || ev.ctrlKey || ev.metaKey || ev.target.matches?.("select,input"))return;
    if(!live()){
      if(ev.key==="Escape"){ev.preventDefault();exitReplay();}
      return;
    }
    if(r.phase!=="turn" || r.turn!==0)return;
    if(ev.key==="ArrowLeft" || ev.key==="ArrowRight"){
      const tiles=[...document.querySelectorAll('.hand-tile:not(:disabled)')].map(e=>+e.dataset.id);if(!tiles.length)return;
      ev.preventDefault();const i=tiles.indexOf(selected),dir=ev.key==="ArrowLeft"?-1:1;
      selectTile(tiles[i<0?(dir<0?tiles.length-1:0):(i+tiles.length+dir)%tiles.length]);
    }else if(ev.key==="Enter" && selected!==null && (document.activeElement===document.body || document.activeElement?.matches(".hand-tile,.commit"))){
      ev.preventDefault();play();
    }else if(ev.key==="Escape"){reachPick=false;selected=null;refresh();}
  });
  $("#rules-btn").innerHTML=icon("book",16)+"局例";
  $("#settings-btn").innerHTML=icon("settings",17)+"對局設定";
  $("#sprite-host").innerHTML=Art.sprites();
  save();refresh();if(r.phase==="result")showModal("result");
})();
</script>
</body></html>
